<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Tesla Code</title>
<body style="font-family:sans-serif;max-width:480px;margin:40px auto;padding:0 16px">
<h2>Fast fertig</h2><p>Kopiere diesen Code und gib ihn deinem Assistenten im sicheren Feld:</p>
<textarea id=t readonly style="width:100%;height:90px;font-size:15px"></textarea>
<p><button onclick="var t=document.getElementById('t');t.select();navigator.clipboard&&navigator.clipboard.writeText(t.value);" style="font-size:16px;padding:8px 16px">Code kopieren</button></p>
<script>var q=new URLSearchParams(location.search);document.getElementById('t').value=q.get('code')||('Fehler: '+(q.get('error')||'kein Code'));</script>
